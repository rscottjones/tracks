{{/*
  track-styles.html — CSS owned by the Tracks plugin alone.
  Shared CSS lives in geo-core-v1.html and geo-media-styles-v1.html.
  Every class here carries the mb-track- prefix; no !important.
*/}}

<style>
  /* Map container. Height arrives as the --mb-map-h custom property
     from the shortcode. */
  .mb-track-map,
  article .mb-track-map {
    position: relative;
    z-index: 0;
    width: 100%;
    height: var(--mb-map-h, 500px);
    border-radius: 12px;
    margin: 30px 0;
  }
  /* A stats bar, elevation chart or legend sits directly below: square
     off the bottom corners so the two read as one panel. */
  .mb-track-map--joined,
  article .mb-track-map--joined {
    border-radius: 12px 12px 0 0;
    margin: 30px 0 0;
  }

  .mb-track-stats-bar {
    background: #f0f0f0;
    border-radius: 0 0 12px 12px;
    padding: 10px 16px;
    margin: 0 0 30px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    row-gap: 6px;
    align-items: center;
    font-family: sans-serif;
    font-size: 14px;
    color: #444;
    min-height: 42px;
    box-sizing: border-box;
  }
  .mb-track-stat          { display: inline-flex; align-items: center; gap: 4px; white-space: nowrap; }
  .mb-track-stat-sep      { color: #ccc; font-size: 8px; flex-shrink: 0; }
  .mb-track-stats-name    { font-weight: 600; color: #333; }
  .mb-track-stats-desc    { color: #666; font-size: 13px; }
  .mb-track-stats-loading { color: #999; font-style: italic; font-size: 13px; }
  .mb-track-stats-error   { color: #c00; font-size: 13px; }

  .mb-track-elevation {
    background: #f0f0f0;
    border-radius: 0 0 12px 12px;
    padding: 10px 16px 12px;
    margin: 0 0 30px;
    box-sizing: border-box;
  }
  .mb-track-elevation svg {
    display: block;
    width: 100%;
    overflow: visible;
  }
  /* When stats bar is also present, stats bar loses its bottom radius
     and elevation chart provides it instead */
  .mb-track-stats-bar + .mb-track-elevation {
    margin-top: 1px;
  }
  .mb-track-stats-bar.mb-track-has-elevation {
    border-radius: 0;
    margin-bottom: 0;
  }

  .mb-track-legend {
    background: #f0f0f0;
    border-radius: 0 0 12px 12px;
    padding: 10px 16px;
    margin: 0 0 30px;
    display: flex;
    flex-wrap: wrap;
    gap: 16px;
    row-gap: 8px;
    align-items: center;
    font-family: sans-serif;
    font-size: 14px;
    color: #444;
    box-sizing: border-box;
  }
  .mb-track-legend-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    white-space: nowrap;
  }
  .mb-track-legend-swatch {
    display: inline-block;
    width: 20px;
    height: 4px;
    border-radius: 2px;
    flex-shrink: 0;
  }
  .mb-track-legend-sep { color: #ccc; font-size: 8px; flex-shrink: 0; }

  .mb-track-legend a {
    color: #444;
    text-decoration: underline;
  }

  /* Popup note text */
  .mb-track-popup-note { color: #444; }

  /* ── Dark mode ── */
  @media (prefers-color-scheme: dark) {
    .mb-track-stats-bar,
    .mb-track-elevation,
    .mb-track-legend {
      background: #1e1e1e;
      color: #ccc;
    }
    .mb-track-stats-name    { color: #e0e0e0; }
    .mb-track-stats-desc    { color: #999; }
    .mb-track-stats-loading { color: #666; }
    .mb-track-stat-sep,
    .mb-track-legend-sep    { color: #444; }

    .mb-track-legend a { color: #7eb8f7; }

    /* Popup note text */
    .mb-track-popup-note { color: #bbb; }
  }
</style>
